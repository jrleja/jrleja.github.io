# Site-wide settings for jrleja.github.io. Rebuild with: python3 build.py
#
# `sections:` is the whole page structure, in order. Each entry needs:
#   id        the anchor and nav target
#   label     the sidebar nav text
#   title     the <h2> heading
#   template  a file in templates/sections/ (prose, group, research, press, talks, pubs)
#   source    a .md file (prose), a directory (one file per item), or a .yml (a list)
#
# Sections are added here as they are ported -- see REVAMP.md, Session 3.

# Write plain text here, never HTML entities: templates escape on output, so a
# literal "&" is correct and "&amp;" would render as "&amp;amp;".
name: Joel Leja
titles:
  - Associate Professor of Astronomy & Astrophysics
  - Dr. Keiko Miwa Ross Mid-Career Professor
affiliation: The Pennsylvania State University

description: >-
  Joel Leja is an associate professor of astronomy and astrophysics at Penn State,
  studying galaxy formation by combining deep JWST surveys with statistics and
  machine learning.

# Absolute URL, used for the canonical link and the Open Graph tags. Needs the
# trailing slash: og:image is built as url + og_image.
url: https://jrleja.github.io/

avatar: images/avatar.jpg
banner: images/banner.jpg
banner_alt: >-
  A galaxy spectral energy distribution from the ultraviolet to the far infrared,
  with observed photometry overlaid on a fitted model spectrum.
stylesheet: assets/css/site.css

# Link-preview card, 1200x630. Regenerate with tools/make-images.py after changing
# the avatar or the palette.
og_image: images/og-card.jpg

# Address-bar colour; matches --sidebar-bg in each theme.
theme_color: "#1d7a63"
theme_color_dark: "#1c5f50"

# `icon:` names a macro case in templates/icons.html; without one the label
# renders as text, which is what ADS and CV want.
links:
  - label: ADS
    url: https://ui.adsabs.harvard.edu/public-libraries/G3CNFVQISayWjz8Fz-9n5g
  - label: CV
    url: files/CV.pdf
  - label: Github
    url: https://github.com/jrleja/
    icon: github
  - label: Email
    url: mailto:joel.leja@psu.edu
    icon: envelope

scripts:
  - assets/js/site.js

sections:
  - id: intro
    label: Intro
    title: Intro
    template: prose
    source: intro.md

  - id: press
    label: Press
    title: Press
    template: press
    source: press.yml

  - id: group
    label: Leja Group
    title: My Research Group
    template: group
    sources:
      current: group          # one .md per person, with a photo
      alumni: alumni.yml      # a text list; the outcome is the point

  - id: outreach
    label: Outreach
    title: Outreach
    template: features
    sources:
      body: outreach.md
      entries: outreach

  - id: research
    label: Research
    title: Research
    template: research
    source: research

  - id: publications
    label: Publications
    title: Selected Publications
    template: pubs
    sources:
      body: pubs.md
      entries: pubs.yml

  - id: contact
    label: Contact
    title: Contact
    template: prose
    source: contact.md
