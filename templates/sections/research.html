{# One research direction per content/research/*.md. An optional `figure:` with a
   `paper:` link renders a captioned figure. The caption is a <figcaption>, not a
   heading -- it is a caption, and putting it in the heading outline made the page's
   structure read as a list of figure titles. #}
{% if section.body %}
{{ section.body|safe }}
{% endif %}

{% for topic in section.entries %}
	{% if topic.get('title') %}
<h3>{{ topic.title }}</h3>
	{% endif %}
{{ topic.html|safe }}
	{% if topic.get('figure') %}
<figure class="figure">
	{% set alt = topic.get('alt', topic.get('title', 'Figure')) %}
	{% if topic.get('paper') %}
	<a href="{{ topic.paper }}" class="image"><img src="{{ topic.figure }}" alt="{{ alt }}" /></a>
	{% else %}
	<span class="image"><img src="{{ topic.figure }}" alt="{{ alt }}" /></span>
	{% endif %}
	{% if topic.get('caption') %}
	<figcaption>{{ topic.caption|safe }}</figcaption>
	{% endif %}
</figure>
	{% endif %}
{% endfor %}
